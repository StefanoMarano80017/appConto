<header class="app-header">
  <h1 class="app-title">Personal Finance Tracker</h1>
  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Riepilogo</a>
    <a routerLink="/analytics" routerLinkActive="active">Analytics</a>
    <a routerLink="/transactions" routerLinkActive="active">Movimenti</a>
    <a routerLink="/loans" routerLinkActive="active">Prestiti</a>
    <a routerLink="/merchants" routerLinkActive="active">Merchant</a>
    <a routerLink="/import" routerLinkActive="active">Import CSV</a>
    <a routerLink="/settings" routerLinkActive="active">Impostazioni</a>
  </nav>

  <button type="button" class="theme-toggle" (click)="toggleTheme()">
    <span class="glyph" aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
    {{ themeAction() }}
  </button>
</header>

<main class="app-main">
  <router-outlet />
</main>
