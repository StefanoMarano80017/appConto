<app-page-layout>
  <app-transactions-toolbar
    [query]="query()"
    [categories]="categoryItems()"
    [merchants]="merchantItems()"
    [searchText]="searchText()"
    (changed)="apply($event)"
    (searchTyped)="onSearchTyped($event)"
    (cleared)="resetFilters()"
  />

  <app-transactions-table-panel
    mode="edit"
    [page]="page()"
    [loading]="transactions.isLoading()"
    [error]="error()"
    emptyHint="Prova a modificare o rimuovere uno dei filtri."
    [emptyActionLabel]="hasFilters() ? 'Reset filtri' : undefined"
    [typeOptions]="typeOptions"
    [categoryOptions]="categoryItems()"
    [sortBy]="query().sortBy"
    [sortDirection]="query().sortDirection"
    [savingId]="edits.savingId()"
    [editError]="edits.error()"
    [extraColumn]="extraColumn()"
    [selectable]="true"
    [selectedIds]="selected()"
    [confirmingDelete]="confirmingDelete()"
    [deleting]="deleting()"
    [deleteError]="deleteError()"
    [deleteDone]="deleteDone()"
    (retry)="transactions.reload()"
    (emptyAction)="resetFilters()"
    (pageSelected)="goToPage($event)"
    (pageSizeSelected)="apply({ pageSize: $event })"
    (sortSelected)="sortBy($event)"
    (selectionToggled)="toggleSelection($event)"
    (allToggled)="toggleAll($event)"
    (typeChange)="edits.changeType($event.row, $event.type)"
    (categoryChange)="edits.changeCategory($event.row, $event.categoryId)"
    (deleteRequested)="askDelete()"
    (deleteConfirmed)="deleteSelected()"
    (deleteCancelled)="cancelDelete()"
    (selectionCleared)="clearSelection()"
  />

  <!--
    La cella della colonna dei prestiti. Il template vive qui perché la cella
    è dominio della feature; quando mostrarla lo decide `extraColumn` nel
    componente.
  -->
  <ng-template #loanColumn let-transaction>
    <app-transaction-loan-cell [transaction]="transaction" [links]="linksOf(transaction.id)" />
  </ng-template>
</app-page-layout>
