<app-panel>
  <app-section-header title="Spese per categoria" />

  @if (categories().length === 0) {
    <p class="message">
      Nessuna spesa nel periodo selezionato.
    </p>
  } @else {
    <ul>
      @for (category of categories(); track category.categoryId ?? 'none') {
        <li>
          <button
            type="button"
            class="row"
            (click)="categorySelected.emit(category.categoryId)"
            [attr.aria-label]="'Filtra per ' + category.name"
          >
            <span class="count">
              {{ category.transactionCount }}
            </span>
            <span class="name">
              {{ category.name }}
            </span>
            <span class="percentage">
              {{ formatPercent(category.percentage) }}
            </span>
            <!--
              `amount` è la magnitudine di una spesa (v. analytics.service), non un valore
              con segno: un rimborso netto la rende negativa. Si nega qui, non con un tono
              forzato, così l'auto deduce il segno vero invece di ribaltarlo sempre.
            -->
            <app-amount class="amount" [value]="-category.amount" />
            <span class="navigation-hint" aria-hidden="true"> → </span>
          </button>
          <span class="bar">
            <span
              [style.width.%]="barWidth(category.amount)"
              [style.background]="category.color ?? 'var(--text-muted)'"
            ></span>
          </span>
        </li>
      }
    </ul>
  }
</app-panel>
