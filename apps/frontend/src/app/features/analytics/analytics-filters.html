<app-panel>
  <app-section-header title="Filtri">
    <svg titleIcon lucideFunnel></svg>
    @if (activeCount() > 0) {
      <app-badge titleAdornment [label]="activeBadgeLabel()" tone="neutral" />
    }
    @if (activeCount() > 0) {
      <button panelActions type="button" class="reset" (click)="store.resetFilters()">Azzera</button>
    }
  </app-section-header>

  <app-filter-group label="Periodo" [initiallyOpen]="true">
    <svg icon lucideCalendarDays></svg>
    <app-period-filter
      [preset]="store.preset()"
      [from]="store.dateRange().from"
      [to]="store.dateRange().to"
      (presetSelected)="selectPreset($event)"
      (fromChange)="setCustomRange($event, store.dateRange().to)"
      (toChange)="setCustomRange(store.dateRange().from, $event)"
    />
  </app-filter-group>

  <app-filter-group
    label="Tipo di movimento"
    [count]="store.filters().types.length"
    [initiallyOpen]="store.filters().types.length > 0"
  >
    <svg icon lucideArrowUpDown></svg>
    <app-toggle-button-group
      [options]="transactionTypeOptions"
      [value]="store.filters().types"
      ariaLabel="Tipo di movimento"
      (toggled)="store.toggleType($event)"
    />
  </app-filter-group>

  <app-filter-group
    label="Categoria"
    [count]="store.filters().categoryIds.length"
    [initiallyOpen]="store.filters().categoryIds.length > 0"
  >
    <svg icon lucideTag></svg>
    <app-toggle-button-group
      [options]="categoryOptions()"
      [value]="store.filters().categoryIds"
      ariaLabel="Categoria"
      (toggled)="store.toggleCategory($event)"
    />
  </app-filter-group>

  <app-filter-group
    label="Merchant"
    [count]="store.filters().merchantIds.length"
    [initiallyOpen]="store.filters().merchantIds.length > 0"
  >
    <svg icon lucideStore></svg>
    <app-toggle-list-group
      [options]="merchants()"
      [value]="store.filters().merchantIds"
      ariaLabel="Merchant"
      searchPlaceholder="Cerca un merchant…"
      searchAriaLabel="Cerca un merchant"
      noResultsMessage="Nessun merchant corrisponde alla ricerca."
      [maxOptions]="suggestedMerchantsLimit"
      (toggled)="store.toggleMerchant($event)"
    />
  </app-filter-group>

  <app-filter-group
    label="Classificazione"
    [count]="store.filters().classification === 'all' ? 0 : 1"
    [initiallyOpen]="store.filters().classification !== 'all'"
  >
    <svg icon lucideListChecks></svg>
    <app-choice-group
      [options]="classifications"
      [value]="store.filters().classification"
      ariaLabel="Classificazione"
      (selected)="store.setClassification($event)"
    />
  </app-filter-group>

  @if (activeFilters().length > 0) {
    <app-filter-chips
      class="chips"
      [chips]="activeFilters()"
      (removed)="removeFilter($event)"
      (cleared)="store.resetFilters()"
    />
  }

</app-panel>
