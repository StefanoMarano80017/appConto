<!--
  Nessun comando sui criteri: si cambiano dai filtri, o con un click sui
  grafici. Pagina e ordinamento invece sono di questa tabella sola.
-->
<app-transactions-table-panel
  title="Transazioni del periodo"
  mode="readonly"
  [page]="page()"
  [loading]="transactions.isLoading()"
  [error]="error()"
  emptyMessage="Nessuna transazione per i filtri attivi."
  [typeOptions]="typeOptions"
  [sortBy]="sortBy()"
  [sortDirection]="sortDirection()"
  [showTotal]="complete()"
  (retry)="transactions.reload()"
  (pageSelected)="pageNumber.set($event)"
  (pageSizeSelected)="pageSize.set($event)"
  (sortSelected)="onSortSelected($event)"
/>
