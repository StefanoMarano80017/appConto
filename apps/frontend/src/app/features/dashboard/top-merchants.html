<app-panel>
  <app-section-header title="Top merchant del mese">
    <a panelActions class="all-link" routerLink="/merchants">Tutti i merchant →</a>
  </app-section-header>

  @if (merchants().length === 0) {
    <p class="message">Nessuna spesa nel periodo selezionato.</p>
  } @else {
    <ol class="merchants">
      @for (merchant of merchants(); track merchant.id) {
        <li>
          <button
            type="button"
            class="link"
            (click)="merchantSelected.emit(merchant.id)"
            [attr.aria-label]="'Filtra per ' + merchant.label"
          >{{ merchant.label }}</button>
          <span class="category">{{ merchant.categoryName ?? 'Senza categoria' }}</span>
          <span class="count">{{ merchant.transactionCount }}</span>
          <span class="amount">{{ formatAmount(merchant.amount) }}</span>
        </li>
      }
    </ol>
  }
</app-panel>
