<app-panel>
  <h2>Confronto con <span class="month-name">{{ formatMonth(comparison().previousMonth) }}</span></h2>

  <app-stat-card-grid [items]="totals()" />

  @if (comparison().byCategory.length === 0) {
    <p class="message">Nessuna spesa in nessuno dei due mesi.</p>
  } @else {
    <ul class="categories">
      @for (category of comparison().byCategory; track category.id ?? 'none') {
        <li>
          <span class="name">{{ category.name }}</span>
          <!-- Magnitudini di spesa: si negano qui e si lascia dedurre il tono (v. `totals` in month-comparison.ts). -->
          <app-amount class="previous" [value]="-category.previous" />
          <span class="arrow" aria-hidden="true">→</span>
          <app-amount class="current" [value]="-category.current" />
          <!-- Già firmata: stessa inversione di `varianceTone` per il totale. -->
          <app-amount class="difference" [value]="category.difference" [tone]="varianceTone(category.difference)" />
        </li>
      }
    </ul>
  }
</app-panel>
