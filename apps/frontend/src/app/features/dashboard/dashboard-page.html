<app-page-layout>
  <app-panel>
    <div class="toolbar">
      <div>
        <!-- Il titolo "Riepilogo" è già nella fascia superiore della shell: qui resta solo il mese. -->
        <p class="subtitle">{{ formatMonth(filters.month()) }}</p>
      </div>

      <div class="controls">
        <label class="control">
          <span>Mese</span>
          <input type="month" [value]="filters.month()" (change)="onMonthChange($event)" />
        </label>

        <label class="control">
          <span>Tipo</span>
          <app-select
            appearance="field"
            placeholder="Tutti"
            [options]="typeOptions"
            [value]="filters.filters().type"
            (valueChange)="onTypeChange($event)"
          />
        </label>
      </div>
    </div>

    @if (activeFilters().length > 0) {
      <app-filter-chips
        class="chips"
        [chips]="activeFilters()"
        clearLabel="Azzera filtri"
        (removed)="removeFilter($event)"
        (cleared)="filters.clearFilters()"
      />
    }

    @if (error(); as message) {
      <p class="message message--error">{{ message }}</p>
    }

    @if (dashboard()) {
      <app-stat-card-grid [items]="summaryCards()" />
    } @else if (loading()) {
      <p class="message">Caricamento in corso…</p>
    }
  </app-panel>

  @if (dashboard(); as data) {
    <app-cash-flow-card [cashFlow]="data.cashFlow" />

    <app-category-breakdown
      [categories]="data.categories"
      (categorySelected)="filters.setCategory($event)"
      (merchantSelected)="filters.setMerchant($event)"
    />

    <app-top-merchants
      [merchants]="data.topMerchants"
      (merchantSelected)="filters.setMerchant($event)"
    />

    <app-month-comparison [comparison]="data.comparison" />
  }
</app-page-layout>
