<div class="picker">
  <app-form-field [id]="'bookingDate'" label="Data" [error]="errors().bookingDate">
    <app-select
      appearance="field"
      triggerId="bookingDate"
      placeholder="— scegli la colonna —"
      [options]="headerOptions()"
      [value]="form().bookingDate || null"
      (valueChange)="update('bookingDate', $event ?? '')"
      [ariaInvalid]="!!errors().bookingDate"
      [ariaDescribedBy]="bookingDateDescribedBy()"
    />
    @if (example(form().bookingDate); as value) {
      <span class="example">es. {{ value }}</span>
    }
  </app-form-field>

  <app-form-field [id]="'description'" label="Descrizione" [error]="errors().description">
    <app-select
      appearance="field"
      triggerId="description"
      placeholder="— scegli la colonna —"
      [options]="headerOptions()"
      [value]="form().description || null"
      (valueChange)="update('description', $event ?? '')"
      [ariaInvalid]="!!errors().description"
      [ariaDescribedBy]="descriptionDescribedBy()"
    />
    @if (example(form().description); as value) {
      <span class="example">es. {{ value }}</span>
    }
  </app-form-field>

  <fieldset class="amount">
    <legend class="field-label">Importo</legend>

    <div class="options">
      <label class="inline">
        <input
          type="radio"
          name="amountKind"
          [checked]="form().amountKind === 'single'"
          (change)="update('amountKind', 'single')"
        />
        <span>Una sola colonna</span>
      </label>
      <label class="inline">
        <input
          type="radio"
          name="amountKind"
          [checked]="form().amountKind === 'debitCredit'"
          (change)="update('amountKind', 'debitCredit')"
        />
        <span>Uscite ed entrate separate</span>
      </label>
    </div>

    @if (form().amountKind === 'single') {
      <label>
        <span class="field-hint">Colonna dell'importo, col segno che porta</span>
        <app-select
      appearance="field"
      placeholder="— scegli la colonna —"
      [options]="headerOptions()"
      [value]="form().amount || null"
      (valueChange)="update('amount', $event ?? '')"
    />
        @if (example(form().amount); as value) {
          <span class="example">es. {{ value }}</span>
        }
      </label>
    } @else {
      <div class="pair">
        <label>
          <span class="field-hint">Uscite</span>
          <app-select
      appearance="field"
      placeholder="— scegli la colonna —"
      [options]="headerOptions()"
      [value]="form().debit || null"
      (valueChange)="update('debit', $event ?? '')"
    />
          @if (example(form().debit); as value) {
            <span class="example">es. {{ value }}</span>
          }
        </label>
        <label>
          <span class="field-hint">Entrate</span>
          <app-select
      appearance="field"
      placeholder="— scegli la colonna —"
      [options]="headerOptions()"
      [value]="form().credit || null"
      (valueChange)="update('credit', $event ?? '')"
    />
          @if (example(form().credit); as value) {
            <span class="example">es. {{ value }}</span>
          }
        </label>
      </div>
    }

    @if (errors().amount; as message) {
      <span class="field-error">{{ message }}</span>
    }
  </fieldset>

  <app-form-field
    [id]="'typeHint'"
    label="Tipo movimento"
    hint="Facoltativa: distingue prelievi e accrediti. Senza, decide il segno dell'importo."
  >
    <app-select
      appearance="field"
      triggerId="typeHint"
      placeholder="Nessuna colonna"
      [options]="headerOptions()"
      [value]="form().typeHint || null"
      (valueChange)="update('typeHint', $event ?? '')"
      [ariaDescribedBy]="typeHintDescribedBy()"
    />
    @if (example(form().typeHint); as value) {
      <span class="example">es. {{ value }}</span>
    }
  </app-form-field>
</div>
