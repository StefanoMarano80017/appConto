<div class="cards">
  @for (item of items(); track item.label) {
    <div class="card">
      <span class="label">{{ item.label }}</span>
      <span class="value" [class.positive]="item.tone === 'positive'" [class.negative]="item.tone === 'negative'">
        {{ item.value }}
      </span>
    </div>
  }
</div>
