<div class="section-header">
  <div class="title-block">
    <div class="title-row">
      <span class="title-icon" aria-hidden="true"><ng-content select="[titleIcon]" /></span>
      <h2>{{ title() }}</h2>
      <ng-content select="[titleAdornment]" />
    </div>
    @if (subtitle(); as text) {
      <p class="subtitle">{{ text }}</p>
    }
  </div>
  <div class="actions">
    <ng-content select="[panelActions]" />
  </div>
</div>
