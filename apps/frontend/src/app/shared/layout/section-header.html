<div class="section-header">
  <div>
    @if (level() === 'page') {
      <h1>{{ title() }}</h1>
    } @else {
      <h2>{{ title() }}</h2>
    }
    @if (subtitle(); as text) {
      <p class="subtitle">{{ text }}</p>
    }
  </div>
  <div class="actions">
    <ng-content select="[panelActions]" />
  </div>
</div>
