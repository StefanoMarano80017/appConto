<div class="pagination">
  <p class="range">
    @if (range(); as shown) {
      {{ shown }}
    } @else {
      {{ emptyText() }}
    }
  </p>

  @if (pagination().totalPages > 1) {
    <nav class="pages" aria-label="Pagine dei risultati">
      <button
        type="button"
        class="step"
        aria-label="Precedente"
        [disabled]="pagination().page === 1"
        (click)="pageSelected.emit(pagination().page - 1)"
      ><svg lucideChevronLeft aria-hidden="true"></svg></button>

      @for (slot of slots(); track $index) {
        @if (slot.kind === 'page') {
          <button
            type="button"
            class="page"
            [class.current]="slot.page === pagination().page"
            [attr.aria-current]="slot.page === pagination().page ? 'page' : null"
            (click)="pageSelected.emit(slot.page)"
          >{{ slot.page }}</button>
        } @else {
          <span class="gap" aria-hidden="true">…</span>
        }
      }

      <button
        type="button"
        class="step"
        aria-label="Successiva"
        [disabled]="pagination().page >= pagination().totalPages"
        (click)="pageSelected.emit(pagination().page + 1)"
      ><svg lucideChevronRight aria-hidden="true"></svg></button>
    </nav>
  }

  <label class="size">
    <span>Per pagina</span>
    <app-select
      appearance="field"
      [options]="pageSizeOptions"
      [value]="pageSizeValue()"
      (valueChange)="pageSizeSelected.emit(+$event!)"
    />
  </label>
</div>
