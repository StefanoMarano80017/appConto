@for (option of options(); track option.id) {
  <button
    type="button"
    [class.active]="value().includes(option.id)"
    [attr.aria-pressed]="value().includes(option.id)"
    (click)="toggled.emit(option.id)"
  >
    @if (value().includes(option.id)) {
      <span class="icon toggle-button-group-icon" aria-hidden="true">
        <svg lucideX></svg>
      </span>
    }
    <span class="label">{{ option.label }}</span>
  </button>
}
