@for (option of options(); track option.id) {
  <button
    type="button"
    [class.active]="active().has(option.id)"
    [attr.aria-pressed]="active().has(option.id)"
    [attr.title]="option.description ?? null"
    [attr.aria-label]="option.description ? option.label + ', ' + option.description : null"
    (click)="choose(option.id)"
  >{{ option.label }}</button>
}
