@if (icon()) {
  <label class="with-icon">
    <span class="icon" aria-hidden="true">🔎</span>
    <input
      type="search"
      [placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel() ?? null"
      [value]="value()"
      (input)="valueChange.emit($any($event.target).value)"
    />
  </label>
} @else {
  <input
    type="search"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel() ?? null"
    [value]="value()"
    (input)="valueChange.emit($any($event.target).value)"
  />
}
