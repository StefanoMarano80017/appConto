@for (chip of chips(); track chip.key) {
  <button type="button" class="chip" (click)="removed.emit(chip.key)">
    {{ chip.label }} <span class="icon" aria-hidden="true"><svg lucideX></svg></span>
  </button>
}
<button type="button" class="clear" (click)="cleared.emit()">{{ clearLabel() }}</button>
